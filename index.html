<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>German Jimenez</title>
<meta name="description" content="German Jimenez, Real Estate Developer. Save my contact and see my projects.">
<meta name="theme-color" content="#0b0b0b">
<meta property="og:title" content="German Jimenez | Real Estate Developer">
<meta property="og:description" content="Save my contact and see my projects.">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0b;
    --gold: #c9a45c;
    --gold-hi: #dcbb78;
    --cream: #efe9dc;
    --muted: rgba(239, 233, 220, 0.72);
    --line: rgba(201, 164, 92, 0.55);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--cream);
    font-family: Inter, -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: var(--bg); }
  .bg video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; opacity: 0; transition: opacity .8s ease;
  }
  .bg video.ready { opacity: 1; }
  .bg::after {
    content: ""; position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(11,11,11,.55) 0%, rgba(11,11,11,.35) 35%, rgba(11,11,11,.75) 70%, rgba(11,11,11,.95) 100%);
  }
  main {
    position: relative; z-index: 1;
    min-height: 100vh; min-height: 100svh;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding: max(48px, env(safe-area-inset-top)) 20px max(36px, env(safe-area-inset-bottom));
    text-align: center;
  }
  .card { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; }
  .logo { width: 104px; height: 104px; margin-bottom: 22px; filter: drop-shadow(0 4px 18px rgba(0,0,0,.5)); }
  h1 {
    font-family: "Cormorant Garamond", "Times New Roman", serif;
    font-weight: 600; font-size: clamp(38px, 11vw, 48px); line-height: 1.05; letter-spacing: .01em;
    text-shadow: 0 2px 20px rgba(0,0,0,.5);
  }
  .role {
    margin-top: 10px; font-size: 13px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--gold-hi);
  }
  .rule { width: 56px; height: 1px; background: var(--line); margin: 22px 0 26px; }
  .actions { width: 100%; display: grid; gap: 12px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 54px; padding: 0 20px; border-radius: 4px;
    font: 600 15px/1 Inter, system-ui, sans-serif; letter-spacing: .04em; text-decoration: none;
    cursor: pointer; border: 1px solid var(--line); background: rgba(11,11,11,.45); color: var(--cream);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    transition: background .2s, border-color .2s, transform .1s;
  }
  .btn:active { transform: scale(.98); }
  .btn:hover { border-color: var(--gold); }
  .btn.primary { background: var(--gold); border-color: var(--gold); color: #141109; }
  .btn.primary:hover { background: var(--gold-hi); }
  .btn svg { width: 18px; height: 18px; flex: none; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .email { margin-top: 22px; font-size: 14px; color: var(--muted); text-decoration: none; word-break: break-all; }
  .email:hover { color: var(--cream); }

  .modal {
    position: fixed; inset: 0; z-index: 10; display: none;
    align-items: center; justify-content: center; padding: 16px;
    background: rgba(0,0,0,.88);
  }
  .modal.open { display: flex; }
  .frame { position: relative; width: 100%; max-width: 960px; aspect-ratio: 16 / 9; background: #000; }
  .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .close {
    position: absolute; top: max(14px, env(safe-area-inset-top)); right: 14px;
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line);
    background: rgba(11,11,11,.6); color: var(--cream); font-size: 22px; cursor: pointer;
  }
  .modal p { position: absolute; bottom: max(20px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font-size: 13px; }
  .modal p a { color: var(--gold-hi); }
  @media (prefers-reduced-motion: reduce) { .bg video { display: none; } }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <video class="clip" src="clips/c1.mp4" autoplay muted playsinline preload="auto"></video>
    <video class="clip" muted playsinline preload="auto"></video>
  </div>

  <main>
    <div class="card">
      <img class="logo" src="logo.svg" alt="GJ logo">
      <h1>German Jimenez</h1>
      <div class="role">Real Estate Developer</div>
      <div class="rule"></div>

      <div class="actions">
        <a class="btn primary" href="german-jimenez.vcf" download="German Jimenez.vcf">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
          Save Contact
        </a>
        <button class="btn" id="watch" type="button">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5z"/></svg>
          Watch My Projects
        </button>
        <div class="row">
          <a class="btn" href="mailto:jimenezgerman82@yahoo.com">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
            Email
          </a>
          <button class="btn" id="share" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg>
            <span id="shareLabel">Share</span>
          </button>
        </div>
      </div>

      <a class="email" href="mailto:jimenezgerman82@yahoo.com">jimenezgerman82@yahoo.com</a>
    </div>
  </main>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Project video">
    <button class="close" id="close" type="button" aria-label="Close">&times;</button>
    <div class="frame" id="frame"></div>
    <p><a href="https://vimeo.com/1233812266" target="_blank" rel="noopener">Open on Vimeo</a></p>
  </div>

<script>
  const VIMEO_ID = "1233812266";
// Background: short clips of the land, house and plaza, cross-faded in a loop.
const CLIPS = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => "clips/c" + n + ".mp4");
const FADE = 0.8;
const vids = [...document.querySelectorAll(".bg video")];
let cur = 0, idx = 0, paused = false, switching = false;
const bg = {
  pause() { paused = true; vids.forEach(v => v.pause()); },
  play() { paused = false; return vids[cur].play(); }
};
function queueNext() {
  const nxt = vids[1 - cur];
  nxt.src = CLIPS[(idx + 1) % CLIPS.length];
  nxt.load();
}
function advance() {
  if (switching || paused) return;
  switching = true;
  const a = vids[cur], b = vids[1 - cur];
  b.currentTime = 0;
  b.play().catch(() => {});
  b.classList.add("ready");
  a.classList.remove("ready");
  idx = (idx + 1) % CLIPS.length;
  cur = 1 - cur;
  setTimeout(() => { a.pause(); queueNext(); switching = false; }, FADE * 1000 + 100);
}
vids.forEach(v => {
  v.addEventListener("timeupdate", () => {
    if (v === vids[cur] && v.duration && v.currentTime >= v.duration - FADE) advance();
  });
  v.addEventListener("ended", () => { if (v === vids[cur]) advance(); });
});
const first = vids[0];
const start = () => { first.classList.add("ready"); first.play().catch(() => {}); queueNext(); };
if (first.readyState >= 3) start(); else first.addEventListener("canplay", start, { once: true });

  const modal = document.getElementById("modal");
  const frame = document.getElementById("frame");
  document.getElementById("watch").addEventListener("click", () => {
    frame.innerHTML = '<iframe src="https://player.vimeo.com/video/' + VIMEO_ID +
      '?autoplay=1&title=0&byline=0&portrait=0&color=c9a45c" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen title="German Jimenez projects"></iframe>';
    modal.classList.add("open");
    bg.pause();
  });
  const closeModal = () => { modal.classList.remove("open"); frame.innerHTML = ""; bg.play().catch(() => {}); };
  document.getElementById("close").addEventListener("click", closeModal);
  modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

  document.getElementById("share").addEventListener("click", async () => {
    const data = { title: "German Jimenez", text: "German Jimenez, Real Estate Developer", url: location.href };
    if (navigator.share) { try { await navigator.share(data); } catch (_) {} return; }
    try {
      await navigator.clipboard.writeText(location.href);
      const l = document.getElementById("shareLabel"); l.textContent = "Link copied";
      setTimeout(() => l.textContent = "Share", 2000);
    } catch (_) {}
  });
</script>
</body>
</html>
